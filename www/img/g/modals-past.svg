<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="Must have, might have, can't have, should have">
<rect width="360" height="250" rx="16" fill="#f4f6f8"/>
<text x="18" y="22" font-size="14" fill="#1f2933" font-weight="800" text-anchor="start">Modali al passato: cosa è successo?</text><text x="18" y="48" font-size="13" fill="#2fa84f" font-weight="800" text-anchor="start">must have + participio</text><rect x="250" y="39" width="94" height="10" rx="5" fill="#dfe5ea"/><rect x="250" y="39" width="89.3" height="10" rx="5" fill="#2fa84f"/><text x="18" y="64" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">sono sicuro che è successo</text><text x="18" y="78" font-size="11" fill="#1f2933" font-weight="400" text-anchor="start" font-style="italic">She must have left.</text><text x="18" y="100" font-size="13" fill="#e08a00" font-weight="800" text-anchor="start">might / could have + participio</text><rect x="250" y="91" width="94" height="10" rx="5" fill="#dfe5ea"/><rect x="250" y="91" width="47" height="10" rx="5" fill="#e08a00"/><text x="18" y="116" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">forse è successo</text><text x="18" y="130" font-size="11" fill="#1f2933" font-weight="400" text-anchor="start" font-style="italic">She might have forgotten.</text><text x="18" y="152" font-size="13" fill="#e5484d" font-weight="800" text-anchor="start">can't / couldn't have + participio</text><rect x="250" y="143" width="94" height="10" rx="5" fill="#dfe5ea"/><rect x="250" y="143" width="8" height="10" rx="5" fill="#e5484d"/><text x="18" y="168" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">sono sicuro che NON è successo</text><text x="18" y="182" font-size="11" fill="#1f2933" font-weight="400" text-anchor="start" font-style="italic">She can't have seen us.</text><text x="18" y="204" font-size="13" fill="#8e5cd9" font-weight="800" text-anchor="start">should have + participio</text><rect x="250" y="190" width="94" height="22" rx="12" fill="#8e5cd9"/><text x="297" y="205.5" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">critica</text><text x="18" y="220" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">rimprovero o rimpianto</text><text x="18" y="234" font-size="11" fill="#1f2933" font-weight="400" text-anchor="start" font-style="italic">You should have called!</text>
</svg>
