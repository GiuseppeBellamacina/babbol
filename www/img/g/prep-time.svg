<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="In, on e at per il tempo">
<rect width="360" height="220" rx="16" fill="#f4f6f8"/>
<text x="18" y="22" font-size="14" fill="#1f2933" font-weight="800" text-anchor="start">Preposizioni di tempo: IN &gt; ON &gt; AT</text><path d="M24 40 L336 40 L296 94 L64 94 Z" fill="#cfe2ff"/><path d="M64 94 L296 94 L262 138 L98 138 Z" fill="#d5f1dd"/><path d="M98 138 L262 138 L226 182 L134 182 Z" fill="#ffe8c2"/><text x="180" y="58" font-size="15" fill="#2b7de9" font-weight="900" text-anchor="middle">IN</text><text x="180" y="76" font-size="11" fill="#1f2933" font-weight="400" text-anchor="middle">mesi, anni, stagioni, secoli</text><text x="180" y="89" font-size="10" fill="#5f6c7b" font-weight="400" text-anchor="middle" font-style="italic">in May, in 2024, in the morning</text><text x="180" y="111" font-size="15" fill="#2fa84f" font-weight="900" text-anchor="middle">ON</text><text x="180" y="126" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle">giorni e date: on Monday, on 5 May</text><text x="180" y="155" font-size="15" fill="#e08a00" font-weight="900" text-anchor="middle">AT</text><text x="180" y="170" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle">ora esatta: at 7.30, at night</text><text x="18" y="208" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">Dal periodo più ampio al momento preciso.</text>
</svg>
