<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="Must be, might be, can't be: livelli di certezza">
<rect width="360" height="220" rx="16" fill="#f4f6f8"/>
<text x="18" y="22" font-size="14" fill="#1f2933" font-weight="800" text-anchor="start">Quanto sei sicuro? (deduzioni)</text><text x="18" y="50" font-size="14" fill="#2fa84f" font-weight="800" text-anchor="start">must be</text><rect x="190" y="41" width="150" height="10" rx="5" fill="#dfe5ea"/><rect x="190" y="41" width="142.5" height="10" rx="5" fill="#2fa84f"/><text x="18" y="67" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">sono quasi certo che sia così</text><text x="18" y="82" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start" font-style="italic">He must be at work.</text><text x="18" y="106" font-size="14" fill="#e08a00" font-weight="800" text-anchor="start">may / might / could be</text><rect x="190" y="97" width="150" height="10" rx="5" fill="#dfe5ea"/><rect x="190" y="97" width="75" height="10" rx="5" fill="#e08a00"/><text x="18" y="123" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">è possibile, non so</text><text x="18" y="138" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start" font-style="italic">He might be ill.</text><text x="18" y="162" font-size="14" fill="#e5484d" font-weight="800" text-anchor="start">can't be</text><rect x="190" y="153" width="150" height="10" rx="5" fill="#dfe5ea"/><rect x="190" y="153" width="8" height="10" rx="5" fill="#e5484d"/><text x="18" y="179" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">sono quasi certo che NON sia così</text><text x="18" y="194" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start" font-style="italic">He can't be at home.</text><text x="190" y="212" font-size="9.5" fill="#5f6c7b" font-weight="400" text-anchor="start">0%</text><text x="332" y="212" font-size="9.5" fill="#5f6c7b" font-weight="400" text-anchor="end">100%</text>
</svg>
