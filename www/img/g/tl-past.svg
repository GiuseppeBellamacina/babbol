<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="Azione lunga interrotta da un'azione breve">
<rect width="360" height="200" rx="16" fill="#f4f6f8"/>
<text x="18" y="24" font-size="14" fill="#1f2933" font-weight="800" text-anchor="start">Past continuous + past simple</text><line x1="22" y1="118" x2="334" y2="118" stroke="#5f6c7b" stroke-width="2.5" stroke-linecap="round"/><path d="M331 112.5 L340 118 L331 123.5 Z" fill="#5f6c7b"/><line x1="312" y1="96" x2="312" y2="122" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/><text x="312" y="136" font-size="10.5" fill="#e5484d" font-weight="700" text-anchor="middle">ADESSO</text><rect x="60" y="104" width="170" height="28" rx="14" fill="#2b7de9" opacity="0.9"/><text x="145" y="123" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">was walking</text><line x1="170" y1="60" x2="170" y2="104" stroke="#e5484d" stroke-width="2.5" stroke-linecap="round"/><circle cx="170" cy="58" r="7" fill="#e5484d"/><text x="170" y="46" font-size="12.5" fill="#e5484d" font-weight="800" text-anchor="middle">heard a noise</text><text x="18" y="160" font-size="11.5" fill="#2b7de9" font-weight="700" text-anchor="start">Past continuous: l'azione lunga, lo sfondo (stavo camminando)</text><text x="18" y="178" font-size="11.5" fill="#e5484d" font-weight="700" text-anchor="start">Past simple: l'azione breve che interrompe (ho sentito)</text>
</svg>
