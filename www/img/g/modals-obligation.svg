<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="Must, should, don't have to e mustn't">
<rect width="360" height="214" rx="16" fill="#f4f6f8"/>
<text x="18" y="22" font-size="14" fill="#1f2933" font-weight="800" text-anchor="start">Obbligo, consiglio, divieto</text><rect x="18" y="36" width="126" height="28" rx="12" fill="#e5484d"/><text x="81" y="54.5" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">must / have to</text><text x="154" y="48" font-size="12" fill="#e5484d" font-weight="700" text-anchor="start">è obbligatorio</text><text x="154" y="63" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">You must wear a seat belt.</text><rect x="18" y="74" width="126" height="28" rx="12" fill="#e08a00"/><text x="81" y="92.5" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">should</text><text x="154" y="86" font-size="12" fill="#e08a00" font-weight="700" text-anchor="start">è un consiglio</text><text x="154" y="101" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">You should see a doctor.</text><rect x="18" y="112" width="126" height="28" rx="12" fill="#2fa84f"/><text x="81" y="130.5" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">don't have to</text><text x="154" y="124" font-size="12" fill="#2fa84f" font-weight="700" text-anchor="start">non è necessario (ma puoi)</text><text x="154" y="139" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">You don't have to pay.</text><rect x="18" y="150" width="126" height="28" rx="12" fill="#8e5cd9"/><text x="81" y="168.5" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">mustn't</text><text x="154" y="162" font-size="12" fill="#8e5cd9" font-weight="700" text-anchor="start">è vietato</text><text x="154" y="177" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">You mustn't smoke here.</text><text x="18" y="204" font-size="11.5" fill="#e5484d" font-weight="800" text-anchor="start">Attenzione: don't have to ≠ mustn't</text>
</svg>
