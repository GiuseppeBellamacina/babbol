<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="Present perfect e past simple a confronto">
<rect width="360" height="220" rx="16" fill="#f4f6f8"/>
<text x="18" y="22" font-size="14" fill="#2fa84f" font-weight="800" text-anchor="start">Present perfect</text><text x="130" y="22" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">il passato che arriva a oggi</text><line x1="22" y1="100" x2="334" y2="100" stroke="#5f6c7b" stroke-width="2.5" stroke-linecap="round"/><path d="M331 94.5 L340 100 L331 105.5 Z" fill="#5f6c7b"/><line x1="296" y1="78" x2="296" y2="104" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/><text x="296" y="118" font-size="10.5" fill="#e5484d" font-weight="700" text-anchor="middle">ADESSO</text><path d="M70 98 C 70 46, 296 46, 296 98" fill="none" stroke="#2fa84f" stroke-width="3.5" stroke-linecap="round"/><path d="M290.5 89 L296 98 L301.5 89 Z" fill="#2fa84f"/><circle cx="70" cy="100" r="6" fill="#2fa84f"/><text x="70" y="122" font-size="11" fill="#2fa84f" font-weight="700" text-anchor="middle">since 2019</text><text x="183" y="84" font-size="12" fill="#1f2933" font-weight="700" text-anchor="middle">I have lived here for 5 years.</text><line x1="18" y1="146" x2="342" y2="146" stroke="#d3dae1" stroke-width="1.5" stroke-linecap="round"/><text x="18" y="168" font-size="14" fill="#2b7de9" font-weight="800" text-anchor="start">Past simple</text><text x="104" y="168" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">finito, con un tempo preciso</text><rect x="112" y="178" width="84" height="26" rx="13" fill="#2b7de9" opacity="0.9"/><text x="154" y="196" font-size="12" fill="#fff" font-weight="800" text-anchor="middle">yesterday</text><text x="212" y="196" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">I saw her yesterday.</text>
</svg>
