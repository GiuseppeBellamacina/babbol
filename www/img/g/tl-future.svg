<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="will, going to e present continuous per il futuro">
<rect width="360" height="210" rx="16" fill="#f4f6f8"/>
<text x="18" y="24" font-size="14" fill="#1f2933" font-weight="800" text-anchor="start">Tre modi di parlare del futuro</text><rect x="18" y="52" width="118" height="34" rx="17" fill="#2b7de9"/><text x="77" y="74" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">will</text><line x1="142" y1="69" x2="168" y2="69" stroke="#2b7de9" stroke-width="3" stroke-linecap="round"/><path d="M167 63.5 L176 69 L167 74.5 Z" fill="#2b7de9"/><text x="186" y="66" font-size="12" fill="#2b7de9" font-weight="700" text-anchor="start">decido adesso / previsione</text><text x="186" y="82" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start">I'll help you.  I think it will rain.</text><rect x="18" y="100" width="118" height="34" rx="17" fill="#2fa84f"/><text x="77" y="122" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">going to</text><line x1="142" y1="117" x2="168" y2="117" stroke="#2fa84f" stroke-width="3" stroke-linecap="round"/><path d="M167 111.5 L176 117 L167 122.5 Z" fill="#2fa84f"/><text x="186" y="114" font-size="12" fill="#2fa84f" font-weight="700" text-anchor="start">piano o prova evidente</text><text x="186" y="130" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start">I'm going to study.</text><rect x="18" y="148" width="118" height="34" rx="17" fill="#e08a00"/><text x="77" y="170" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">present continuous</text><line x1="142" y1="165" x2="168" y2="165" stroke="#e08a00" stroke-width="3" stroke-linecap="round"/><path d="M167 159.5 L176 165 L167 170.5 Z" fill="#e08a00"/><text x="186" y="162" font-size="12" fill="#e08a00" font-weight="700" text-anchor="start">accordo già organizzato</text><text x="186" y="178" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start">I'm meeting Anna at six.</text><text x="18" y="198" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">Chiediti: quando ho deciso? l'ho già organizzato?</text>
</svg>
