<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="Present simple e present continuous su una linea del tempo">
<rect width="360" height="210" rx="16" fill="#f4f6f8"/>
<text x="18" y="24" font-size="14" fill="#2b7de9" font-weight="800" text-anchor="start">Present simple</text><text x="18" y="40" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">abitudini e fatti stabili</text><circle cx="40" cy="62" r="6" fill="#2b7de9"/><circle cx="80" cy="62" r="6" fill="#2b7de9"/><circle cx="120" cy="62" r="6" fill="#2b7de9"/><circle cx="160" cy="62" r="6" fill="#2b7de9"/><circle cx="200" cy="62" r="6" fill="#2b7de9"/><circle cx="240" cy="62" r="6" fill="#2b7de9"/><circle cx="280" cy="62" r="6" fill="#2b7de9"/><circle cx="320" cy="62" r="6" fill="#2b7de9"/><text x="180" y="86" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="middle">I get up at 7.  She works in a bank.</text><line x1="22" y1="122" x2="334" y2="122" stroke="#5f6c7b" stroke-width="2.5" stroke-linecap="round"/><path d="M331 116.5 L340 122 L331 127.5 Z" fill="#5f6c7b"/><line x1="190" y1="98" x2="190" y2="140" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/><text x="190" y="154" font-size="10.5" fill="#e5484d" font-weight="700" text-anchor="middle">ADESSO</text><rect x="150" y="110" width="80" height="24" rx="12" fill="#e08a00" opacity="0.92"/><text x="190" y="126.5" font-size="12" fill="#fff" font-weight="800" text-anchor="middle">I'm working</text><text x="18" y="178" font-size="14" fill="#e08a00" font-weight="800" text-anchor="start">Present continuous</text><text x="18" y="194" font-size="11" fill="#5f6c7b" font-weight="400" text-anchor="start">adesso, in questo periodo, temporaneo</text>
