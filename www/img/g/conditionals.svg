<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="I quattro periodi ipotetici">
<rect width="360" height="250" rx="16" fill="#f4f6f8"/>
<text x="18" y="22" font-size="14" fill="#1f2933" font-weight="800" text-anchor="start">I periodi ipotetici (conditionals)</text><rect x="16" y="34" width="30" height="26" rx="13" fill="#5f6c7b"/><text x="31" y="52" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">0</text><text x="54" y="46" font-size="12.5" fill="#5f6c7b" font-weight="800" text-anchor="start">if + present</text><text x="54" y="62" font-size="11.5" fill="#1f2933" font-weight="700" text-anchor="start">-&gt; present</text><text x="54" y="78" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">If you heat ice, it melts.</text><rect x="262" y="36" width="82" height="22" rx="12" fill="#fff" stroke="#5f6c7b" stroke-width="1.5"/><text x="303" y="51.5" font-size="10" fill="#5f6c7b" font-weight="700" text-anchor="middle">sempre vero</text><rect x="16" y="88" width="30" height="26" rx="13" fill="#2fa84f"/><text x="31" y="106" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="54" y="100" font-size="12.5" fill="#2fa84f" font-weight="800" text-anchor="start">if + present</text><text x="54" y="116" font-size="11.5" fill="#1f2933" font-weight="700" text-anchor="start">-&gt; will + verbo</text><text x="54" y="132" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">If it rains, we'll stay home.</text><rect x="262" y="90" width="82" height="22" rx="12" fill="#fff" stroke="#2fa84f" stroke-width="1.5"/><text x="303" y="105.5" font-size="10" fill="#2fa84f" font-weight="700" text-anchor="middle">possibile</text><rect x="16" y="142" width="30" height="26" rx="13" fill="#2b7de9"/><text x="31" y="160" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="54" y="154" font-size="12.5" fill="#2b7de9" font-weight="800" text-anchor="start">if + past simple</text><text x="54" y="170" font-size="11.5" fill="#1f2933" font-weight="700" text-anchor="start">-&gt; would + verbo</text><text x="54" y="186" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">If I had money, I'd buy it.</text><rect x="262" y="144" width="82" height="22" rx="12" fill="#fff" stroke="#2b7de9" stroke-width="1.5"/><text x="303" y="159.5" font-size="10" fill="#2b7de9" font-weight="700" text-anchor="middle">irreale (ora)</text><rect x="16" y="196" width="30" height="26" rx="13" fill="#8e5cd9"/><text x="31" y="214" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="54" y="208" font-size="12.5" fill="#8e5cd9" font-weight="800" text-anchor="start">if + past perfect</text><text x="54" y="224" font-size="11.5" fill="#1f2933" font-weight="700" text-anchor="start">-&gt; would have + part. passato</text><text x="54" y="240" font-size="10.5" fill="#5f6c7b" font-weight="400" text-anchor="start" font-style="italic">If I had known, I would have called.</text><rect x="262" y="198" width="82" height="22" rx="12" fill="#fff" stroke="#8e5cd9" stroke-width="1.5"/><text x="303" y="213.5" font-size="10" fill="#8e5cd9" font-weight="700" text-anchor="middle">irreale (passato)</text>
</svg>
