<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="Future continuous e future perfect">
