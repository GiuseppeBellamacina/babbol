<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif' role="img" aria-label="Past perfect, past simple e past continuous nel racconto">
<rect width="360" height="210" rx="16" fill="#f4f6f8"/>
<text x="18" y="24" font-size="14" fill="#1f2933" font-weight="800" text-anchor="start">Raccontare al passato</text><line x1="22" y1="88" x2="334" y2="88" stroke="#5f6c7b" stroke-width="2.5" stroke-linecap="round"/><path d="M331 82.5 L340 88 L331 93.5 Z" fill="#5f6c7b"/><circle cx="60" cy="88" r="7" fill="#2fa84f"/><text x="60" y="62" font-size="12.5" fill="#2fa84f" font-weight="800" text-anchor="middle">had left</text><text x="60" y="114" font-size="10.5" fill="#2fa84f" font-weight="700" text-anchor="middle">Past perfect</text><text x="60" y="128" font-size="10" fill="#5f6c7b" font-weight="400" text-anchor="middle">(prima)</text><circle cx="200" cy="88" r="7" fill="#2b7de9"/><text x="200" y="62" font-size="12.5" fill="#2b7de9" font-weight="800" text-anchor="middle">arrived</text><text x="212" y="112" font-size="10.5" fill="#2b7de9" font-weight="700" text-anchor="start">Past simple</text><line x1="200" y1="95" x2="200" y2="142" stroke="#2b7de9" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="120" y="142" width="190" height="26" rx="13" fill="#e08a00" opacity="0.92"/><text x="215" y="160" font-size="12.5" fill="#fff" font-weight="800" text-anchor="middle">it was raining</text><text x="318" y="160" font-size="10" fill="#5f6c7b" font-weight="400" text-anchor="start">sfondo</text><text x="18" y="190" font-size="11" fill="#1f2933" font-weight="400" text-anchor="start" font-style="italic">When I arrived, it was raining: they had already left.</text><text x="18" y="205" font-size="9.5" fill="#5f6c7b" font-weight="400" text-anchor="start">Past perfect = prima  |  past simple = i fatti  |  past continuous = lo sfondo</text>
</svg>
